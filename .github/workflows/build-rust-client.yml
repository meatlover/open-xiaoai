name: Build Rust Client

on:
  push:
    branches: [ main, dev, feat/* ]
    paths:
      - 'packages/client-rust/**'
      - '.github/workflows/build-rust-client.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/client-rust/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-armv7:
    name: Build ARMv7 for XiaoAi Device
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: armv7-unknown-linux-gnueabihf
          override: true

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build ARMv7 binary
        working-directory: packages/client-rust
        run: cross build --release --target armv7-unknown-linux-gnueabihf

      - name: Verify binary
        working-directory: packages/client-rust
        run: |
          ls -lh target/armv7-unknown-linux-gnueabihf/release/client
          file target/armv7-unknown-linux-gnueabihf/release/client
          echo "Binary size: $(du -h target/armv7-unknown-linux-gnueabihf/release/client | cut -f1)"

      - name: Strip binary
        working-directory: packages/client-rust
        run: |
          docker run --rm -v $(pwd):/work -w /work \
            ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:latest \
            arm-linux-gnueabihf-strip target/armv7-unknown-linux-gnueabihf/release/client
          echo "Stripped size: $(du -h target/armv7-unknown-linux-gnueabihf/release/client | cut -f1)"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v3
        with:
          name: xiaoai-client-armv7
          path: packages/client-rust/target/armv7-unknown-linux-gnueabihf/release/client
          retention-days: 30

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp packages/client-rust/target/armv7-unknown-linux-gnueabihf/release/client deploy/
          cp packages/client-rust/AI_BRAIN_INTEGRATION.md deploy/
          echo "#!/bin/sh" > deploy/deploy.sh
          echo "# Quick deployment script" >> deploy/deploy.sh
          echo "# Usage: ./deploy.sh <device-ip> <server-ip>" >> deploy/deploy.sh
          echo "" >> deploy/deploy.sh
          echo "DEVICE_IP=\${1:-192.168.1.100}" >> deploy/deploy.sh
          echo "SERVER_IP=\${2:-192.168.1.10}" >> deploy/deploy.sh
          echo "" >> deploy/deploy.sh
          echo "echo 'Deploying to XiaoAi device at \$DEVICE_IP...'" >> deploy/deploy.sh
          echo "scp client root@\$DEVICE_IP:/data/open-xiaoai/client" >> deploy/deploy.sh
          echo "ssh root@\$DEVICE_IP 'chmod +x /data/open-xiaoai/client'" >> deploy/deploy.sh
          echo "echo \"ws://\$SERVER_IP:9000\" | ssh root@\$DEVICE_IP 'cat > /data/open-xiaoai/server.txt'" >> deploy/deploy.sh
          echo "echo 'Deployment complete. Connect via: ssh root@\$DEVICE_IP'" >> deploy/deploy.sh
          chmod +x deploy/deploy.sh
          tar -czf xiaoai-client-armv7.tar.gz -C deploy .

      - name: Upload deployment package
        uses: actions/upload-artifact@v3
        with:
          name: xiaoai-client-deployment
          path: xiaoai-client-armv7.tar.gz
          retention-days: 30

  build-native:
    name: Build Native (for testing)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build native binary
        working-directory: packages/client-rust
        run: cargo build --release

      - name: Run tests
        working-directory: packages/client-rust
        run: cargo test --release

      - name: Upload native binary
        uses: actions/upload-artifact@v3
        with:
          name: xiaoai-client-${{ matrix.os }}
          path: packages/client-rust/target/release/client
          retention-days: 7
