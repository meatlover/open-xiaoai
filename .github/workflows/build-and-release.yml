name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Validate JSON
      run: |
        python3 -c "import json; json.load(open('packages/manifest.json'))"
        echo "✓ manifest.json is valid"
    
    - name: Check file permissions
      run: |
        chmod +x install/install.sh
        chmod +x config/init.d/S99ai-bridge
        echo "✓ Scripts are executable"

  download-packages:
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v3
    
    - name: Download Entware packages
      run: |
        mkdir -p packages/aarch64-k3.10
        cd packages/aarch64-k3.10
        
        REPO="https://bin.entware.net/aarch64-k3.10"
        
        echo "Downloading core packages..."
        curl -fsSL "${REPO}/python3_3.11.10-1_aarch64-3.10.ipk" -o python3.ipk
        curl -fsSL "${REPO}/libpython3_3.11.10-1_aarch64-3.10.ipk" -o libpython3.ipk
        curl -fsSL "${REPO}/python3-base_3.11.10-1_aarch64-3.10.ipk" -o python3-base.ipk
        curl -fsSL "${REPO}/python3-light_3.11.10-1_aarch64-3.10.ipk" -o python3-light.ipk
        curl -fsSL "${REPO}/libopenssl_3.5.0-1_aarch64-3.10.ipk" -o libopenssl3.ipk
        curl -fsSL "${REPO}/openssl-util_3.5.0-1_aarch64-3.10.ipk" -o openssl-util.ipk
        curl -fsSL "${REPO}/python3-pip_23.3.1-1_aarch64-3.10.ipk" -o python3-pip.ipk
        curl -fsSL "${REPO}/zlib_1.3.1-1_aarch64-3.10.ipk" -o zlib.ipk
        curl -fsSL "${REPO}/ca-bundle_20241223-1_all.ipk" -o ca-bundle.ipk
        curl -fsSL "${REPO}/redsocks_0.5-2_aarch64-3.10.ipk" -o redsocks.ipk || true
        curl -fsSL "${REPO}/libevent2-core_2.1.12-1_aarch64-3.10.ipk" -o libevent2-core.ipk || true
        
        ls -la
        
    - name: Verify checksums
      run: |
        cd packages/aarch64-k3.10
        sha256sum *.ipk > checksums.txt
        cat checksums.txt
        
    - name: Upload packages
      uses: actions/upload-artifact@v3
      with:
        name: entware-packages
        path: packages/aarch64-k3.10/*.ipk
        retention-days: 30

  create-release:
    runs-on: ubuntu-latest
    needs: download-packages
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v3
    
    - name: Download packages
      uses: actions/download-artifact@v3
      with:
        name: entware-packages
        path: packages/aarch64-k3.10/
    
    - name: Create offline install package
      run: |
        mkdir -p release
        cp -r install release/
        cp -r config release/
        cp -r src release/
        cp packages/manifest.json release/
        mkdir -p release/packages/aarch64-k3.10
        cp packages/aarch64-k3.10/*.ipk release/packages/aarch64-k3.10/
        cp packages/aarch64-k3.10/checksums.txt release/packages/aarch64-k3.10/
        
        cat > release/install-offline.sh << 'INSTALLER_EOF'
#!/bin/sh
set -e
echo "XiaoAI AI Bridge - Offline Installer"
echo "======================================"
echo ""
if [ ! -d "packages/aarch64-k3.10" ]; then
    echo "ERROR: Packages directory not found"
    exit 1
fi
echo "Installing from bundled packages..."
./install/install.sh --offline "$@"
INSTALLER_EOF
        chmod +x release/install-offline.sh
        
        tar -czf "open-xiaoai-offline-${GITHUB_REF_NAME}.tar.gz" -C release .
        sha256sum "open-xiaoai-offline-${GITHUB_REF_NAME}.tar.gz" > checksums.txt
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          open-xiaoai-offline-*.tar.gz
          checksums.txt
        body: |
          ## XiaoAI AI Bridge ${{ github.ref_name }}
          
          ### Installation
          
          **Online (recommended):**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install/install.sh | sh
          ```
          
          **With SOCKS5 proxy:**
          ```bash
          curl -fsSL ... | SOCKS5_PROXY=socks5://host:1080 sh
          ```
          
          **Offline:**
          Download the tarball and run:
          ```bash
          tar -xzf open-xiaoai-offline-*.tar.gz
          ./install-offline.sh
          ```
          
          ### What is Included
          - Python 3.11
          - OpenSSL 3.x with mTLS support
          - WebSocket client library
          - Optional SOCKS5 proxy support (redsocks)
          - AI Bridge service with auto-start
          
          ### Size
          - Download: ~14 MB
          - Installed: ~35 MB
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-readme:
    runs-on: ubuntu-latest
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update README with version
      run: |
        VERSION=${GITHUB_REF_NAME}
        sed -i "s/VERSION=.*/VERSION=\"${VERSION}\"/" install/install.sh
        sed -i "s/\"version\":.*/\"version\": \"${VERSION}\",/" packages/manifest.json
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add install/install.sh packages/manifest.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update version to ${GITHUB_REF_NAME}"
        git push
