# AI Bridge Configuration
# XiaoAI WebSocket Client for Audio/Text Streaming

# WebSocket Server Configuration
websocket:
  # Server URL (wss:// for TLS, ws:// for plaintext)
  # Configure this to your WebSocket server endpoint
  # url: "wss://your-server.example.com:8765"
  
  # Reconnection settings
  reconnect:
    enabled: true
    max_attempts: 10
    delay: 5  # seconds
    backoff: 2  # exponential backoff multiplier
  
  # Connection timeout
  timeout: 30  # seconds
  
  # Ping interval to keep connection alive
  ping_interval: 30  # seconds
  ping_timeout: 10   # seconds

# mTLS Configuration
mtls:
  enabled: true
  cert_dir: "/data/etc/ssl"
  
  # Certificate paths (auto-generated by init script)
  # ca_cert: "/data/etc/ssl/ca.crt"
  # client_cert: "/data/etc/ssl/client.crt"
  # client_key: "/data/etc/ssl/client.key"

# Proxy Configuration (Optional)
proxy:
  enabled: false
  # SOCKS5 proxy URL
  # Examples:
  #   url: "socks5://localhost:1080"
  #   url: "socks5://user:pass@proxy.example.com:1080"
  url: "socks5://localhost:1080"

# Audio Configuration
audio:
  # Input device (microphone)
  input:
    device: "default"
    sample_rate: 16000
    channels: 1
    format: "s16le"  # signed 16-bit little-endian
    chunk_duration: 100  # milliseconds
  
  # Output device (speaker)
  output:
    device: "default"
    sample_rate: 16000
    channels: 1
    format: "s16le"

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "/data/log/ai-bridge.log"
  max_size: "10MB"
  backup_count: 3

# Device Information
device:
  name: "xiaoai-living-room"  # Friendly name
  location: "living-room"      # Room/location
  
# Feature Flags
features:
  # Enable continuous listening
  continuous_listening: false
  
  # Enable wake word detection
  wake_word: false
  
  # Enable local audio processing
  local_processing: false
  
  # Enable text-to-speech response
  tts_response: true
